name: Pre-market day-trade screen (legacy alias)

# Keep the historical workflow name available while routing all execution
# through the canonical premarket-screen workflow.
on:
  workflow_call:
    inputs:
      names:
        type: string
        required: false
        default: ""
      universe:
        type: string
        required: false
        default: ""
      limit:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated symbol override"
        type: string
        required: false
        default: ""
      universe:
        description: "Index universe override"
        type: string
        required: false
        default: ""
      limit:
        description: "Optional cap on symbols scanned"
        type: string
        required: false
        default: ""

jobs:
  premarket:
    uses: ./.github/workflows/premarket-screen.yml
    with:
      names: ${{ inputs.names }}
      universe: ${{ inputs.universe }}
      limit: ${{ inputs.limit }}
    secrets: inherit
