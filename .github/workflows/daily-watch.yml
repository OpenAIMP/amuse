name: Daily screen watch

# Exception-based daily run over the shared watchlist (watchlist.txt):
# technical stock screen, bull-put/iron-condor opportunities, PMCC watch.
# Reports only material changes. Artifacts keep 90 days of run history.
on:
  schedule:
    # Weekdays 9:45 ET during daylight time / 8:45 ET during standard time.
    - cron: "45 13 * * 1-5"
  workflow_call:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        required: false
        type: string
        default: ""
      universe:
        description: "Index universe override (blank = use watchlist.txt)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        type: string
        required: false
        default: ""
      universe:
        description: "Index universe override (blank = use watchlist.txt)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore prior watch state
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: screen-state
          restore-keys: |
            screen-state-

      - name: Load watchlist
        env:
          INPUT_NAMES: ${{ inputs.names }}
          INPUT_UNIVERSE: ${{ inputs.universe }}
        run: |
          if [ -n "$INPUT_NAMES" ]; then
            [[ "$INPUT_NAMES" =~ ^[A-Za-z0-9.,_-]+$ ]] || { echo "Invalid symbol list" >&2; exit 2; }
            echo "WATCHLIST=$INPUT_NAMES" >> "$GITHUB_ENV"
            echo "UNIVERSE=" >> $GITHUB_ENV
            echo "SRC=custom" >> $GITHUB_ENV
          elif [ -n "$INPUT_UNIVERSE" ]; then
            [[ "$INPUT_UNIVERSE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid universe name" >&2; exit 2; }
            echo "UNIVERSE=$INPUT_UNIVERSE" >> "$GITHUB_ENV"
            echo "WATCHLIST=" >> "$GITHUB_ENV"
            echo "SRC=$INPUT_UNIVERSE" >> "$GITHUB_ENV"
          else
            echo "WATCHLIST=$(grep -v '^#' src/watchlist.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
            echo "UNIVERSE=" >> $GITHUB_ENV
            echo "SRC=watchlist" >> $GITHUB_ENV
          fi
          chmod +x bin/public-mcp
          mkdir -p state reports

      - name: Stock screener
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          if [ -n "$UNIVERSE" ]; then
            python3 src/stock_screener.py --universe "$UNIVERSE" \
              --json-out reports/stock-screen.json | tee reports/stock-screen.txt
          else
            python3 src/stock_screener.py --names "$WATCHLIST" \
              --json-out reports/stock-screen.json | tee reports/stock-screen.txt
          fi

      - name: Spread screener (bull puts + iron condors)
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          if [ -n "$UNIVERSE" ]; then
            python3 src/spread_screener.py --universe "$UNIVERSE" \
              --iv-history state/iv_history.jsonl \
              --json-out reports/spread-screen.json | tee reports/spread-screen.txt
          else
            python3 src/spread_screener.py --names "$WATCHLIST" \
              --iv-history state/iv_history.jsonl \
              --json-out reports/spread-screen.json | tee reports/spread-screen.txt
          fi

      - name: Lev-ETF stock screener
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          python3 src/stock_screener.py --universe lev_etf \
            --json-out reports/stock-levetf.json | tee reports/stock-levetf.txt
      
      - name: Lev-ETF spread screener
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          python3 src/spread_screener.py --universe lev_etf \
            --iv-history state/iv_history.jsonl \
            --json-out reports/spread-levetf.json | tee reports/spread-levetf.txt

      - name: Unified six-step decision report
        if: always()
        run: |
          if [ -s reports/stock-screen.json ] && [ -s reports/spread-screen.json ]; then
            python3 src/decision_engine.py \
              --stock reports/stock-screen.json \
              --spreads reports/spread-screen.json \
              --json-out reports/decision.json \
              --markdown-out reports/decision.md
          else
            echo "Decision report skipped: required screener output is missing."
          fi

      - name: Lev-ETF six-step decision report
        if: always()
        run: |
          if [ -s reports/stock-levetf.json ] && [ -s reports/spread-levetf.json ]; then
            python3 src/decision_engine.py \
              --stock reports/stock-levetf.json \
              --spreads reports/spread-levetf.json \
              --json-out reports/decision-levetf.json \
              --markdown-out reports/decision-levetf.md
          else
            echo "Lev-ETF decision report skipped: required screener output is missing."
          fi

      - name: PMCC exception watch
        if: always()
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          python3 src/pmcc_watch.py --names "$WATCHLIST" | tee reports/pmcc-watch.txt

      - name: Fetch market news
        run: |
          python3 src/fetch_news.py \
            --reports reports/stock-screen.json reports/spread-screen.json \
              reports/stock-levetf.json reports/spread-levetf.json \
            --out reports/news.json --market-out docs/news.json || true

      - name: Render lev-ETF report
        if: always()
        run: |
          STAMP=$(date -u +%F-%H%M)
          if [ -s reports/stock-levetf.json ] && [ -s reports/spread-levetf.json ]; then
            REPORT_ARGS=(--hide-portfolio-risk)
            if [ -s reports/decision-levetf.json ]; then
              REPORT_ARGS+=(--decision reports/decision-levetf.json)
            fi
            python3 src/render_report.py --stock reports/stock-levetf.json \
              --spreads reports/spread-levetf.json \
              --news reports/news.json \
              "${REPORT_ARGS[@]}" \
              --report-id daily-lev_etf-$STAMP --source "lev_etf" --source-detail "29 names"
          fi
          python3 src/render_hub.py

      - name: Save watch state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/
          key: screen-state-${{ github.run_id }}

      - name: Upload run outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-watch-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Render dashboard
        if: always()
        run: |
          mkdir -p docs/reports
          STAMP=$(date -u +%F-%H%M)
          if [ "$SRC" = "custom" ]; then
            DETAIL="$(echo "$WATCHLIST" | tr ',' '\n' | grep -c . | tr -d ' ') names"
          elif [ "$SRC" = "watchlist" ]; then
            DETAIL="$(grep -v '^#' src/watchlist.txt | grep -vc '^$' | tr -d ' ') names"
          else
            DETAIL="$(PYTHONPATH=src python3 -c "import universes; print(str(len(universes.UNIVERSES['$SRC']))+' names')")"
          fi
          REPORT_ARGS=()
          if [ -s reports/decision.json ]; then
            REPORT_ARGS+=(--decision reports/decision.json)
          fi
          if [ -s reports/portfolio-risk.json ]; then
            REPORT_ARGS+=(--portfolio-risk reports/portfolio-risk.json)
          fi
          python3 src/render_report.py --stock reports/stock-screen.json \
            --spreads reports/spread-screen.json \
            --news reports/news.json \
            "${REPORT_ARGS[@]}" \
            --report-id daily-$SRC-$STAMP --source "$SRC" --source-detail "$DETAIL"
          python3 src/render_hub.py
          ls docs/index.html

      - name: Publish dashboard to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # bin/public-mcp is chmod +x'd every run, flipping the mode of a
          # tracked file (API pushes land as 100644). Discard the flip so it
          # never blocks the rebase below.
          git checkout -- bin/public-mcp 2>/dev/null || true
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: update daily screen"
          # Fold in concurrent pushes (doc edits, other jobs). If the hub
          # conflicts, keep the remote copy — it is re-rendered from all
          # reports right below, so nothing is lost.
          git pull --rebase --strategy-option=theirs
          python3 src/render_compare.py --universe lev_etf --top 15
          python3 src/render_hub.py
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: rebuild hub after rebase"
          git push
