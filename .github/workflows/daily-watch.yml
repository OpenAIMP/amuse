name: Daily screen watch

# Exception-based daily run over the shared watchlist (watchlist.txt):
# technical stock screen, bull-put/iron-condor opportunities, PMCC watch.
# Reports only material changes. Artifacts keep 90 days of run history.
on:
  # Scheduled runs are owned by master.yml (which calls this workflow).
  # Manual runs use workflow_dispatch below.
  workflow_call:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        required: false
        type: string
        default: ""
      universe:
        description: "Index universe override (blank = use watchlist.txt)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        required: false
        default: ""
      universe:
        description: "Index universe override (blank = use watchlist.txt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore prior watch state
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: screen-state

      - name: Load watchlist
        run: |
          if [ -n "${{ inputs.names }}" ]; then
            echo "WATCHLIST=${{ inputs.names }}" >> $GITHUB_ENV
            echo "UNIVERSE=" >> $GITHUB_ENV
            echo "SRC=custom" >> $GITHUB_ENV
          elif [ -n "${{ inputs.universe }}" ]; then
            echo "UNIVERSE=${{ inputs.universe }}" >> $GITHUB_ENV
            echo "WATCHLIST=" >> $GITHUB_ENV
            echo "SRC=${{ inputs.universe }}" >> $GITHUB_ENV
          else
            echo "WATCHLIST=$(grep -v '^#' watchlist.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
            echo "UNIVERSE=" >> $GITHUB_ENV
            echo "SRC=watchlist" >> $GITHUB_ENV
          fi
          chmod +x bin/public-mcp
          mkdir -p state reports

      - name: Stock screener
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
        run: |
          if [ -n "$UNIVERSE" ]; then
            python3 stock_screener.py --universe "$UNIVERSE" \
              --json-out reports/stock-screen.json | tee reports/stock-screen.txt
          else
            python3 stock_screener.py --names "$WATCHLIST" \
              --json-out reports/stock-screen.json | tee reports/stock-screen.txt
          fi

      - name: Spread screener (bull puts + iron condors)
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
        run: |
          if [ -n "$UNIVERSE" ]; then
            python3 spread_screener.py --universe "$UNIVERSE" \
              --json-out reports/spread-screen.json | tee reports/spread-screen.txt
          else
            python3 spread_screener.py --names "$WATCHLIST" \
              --json-out reports/spread-screen.json | tee reports/spread-screen.txt
          fi

      - name: PMCC exception watch
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
        run: |
          python3 pmcc_watch.py --names "$WATCHLIST" | tee reports/pmcc-watch.txt

      - name: Save watch state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/
          key: screen-state-${{ github.run_id }}

      - name: Upload run outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-watch-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Render dashboard
        if: always()
        run: |
          mkdir -p docs/reports
          STAMP=$(date +%F)
          if [ "$SRC" = "custom" ]; then
            DETAIL="$(echo "$WATCHLIST" | tr ',' '\n' | grep -c . | tr -d ' ') names"
          elif [ "$SRC" = "watchlist" ]; then
            DETAIL="$(grep -v '^#' watchlist.txt | grep -vc '^$' | tr -d ' ') names"
          else
            DETAIL="$(python3 -c "import universes; print(str(len(universes.UNIVERSES['$SRC']))+' names')")"
          fi
          python3 render_report.py --stock reports/stock-screen.json \
            --spreads reports/spread-screen.json \
            --report-id daily-$SRC-$STAMP --source "$SRC" --source-detail "$DETAIL"
          python3 render_hub.py
          ls docs/index.html

      - name: Publish dashboard to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: update daily screen"
          git push
