name: Refresh index universes

# Rebuilds src/universes/*.txt from upstream sources (Wikipedia constituent
# tables, iShares IWM holdings) and commits only genuine changes.
# The Dow 30 list is curated inside the script and verified annually.

on:
  schedule:
    # GitHub cron cannot express an nth weekday directly; schedule-gate below
    # filters this first-week/Sunday superset down to the first Sunday only.
    - cron: "0 6 1-7 * 0"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      first_sunday: ${{ steps.date.outputs.first_sunday }}
    steps:
      - id: date
        shell: bash
        run: |
          day=$(TZ=America/New_York date +%d)
          weekday=$(TZ=America/New_York date +%u)
          first_sunday=false
          if [ "$weekday" = "7" ] && [ "$day" -le 7 ]; then first_sunday=true; fi
          echo "first_sunday=$first_sunday" >> "$GITHUB_OUTPUT"

  refresh:
    needs: schedule-gate
    if: ${{ github.event_name != 'schedule' || needs.schedule-gate.outputs.first_sunday == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild universe files
        run: |
          python3 src/build_universes.py
          git status --short src/universes/

      - name: Commit changed universes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/universes/
          if git diff --cached --quiet; then
            echo "No universe changes — nothing to commit."
          else
            git commit -m "universes: monthly refresh of index constituents"
            git pull --rebase
            git push
          fi
