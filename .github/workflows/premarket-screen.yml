name: Pre-market gap screen

# Scans the watchlist for pre-market gap + volume candidates.
# Runs at 9:00am ET on weekdays, before the open. Independent of master.yml.
on:
  schedule:
    # Weekdays 9:00am ET (13:00 UTC; drifts an hour with DST).
    - cron: "0 13 * * 1-5"
  workflow_call:
    inputs:
      names:
        type: string
        required: false
        default: ""
      universe:
        type: string
        required: false
        default: ""
      limit:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = watchlist.txt)"
        type: string
        required: false
        default: ""
      universe:
        description: "Index universe override (blank = Nasdaq-100)"
        type: string
        required: false
        default: ""
      limit:
        description: "Cap universe size (for tests; blank = full universe)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load watchlist
        env:
          INPUT_NAMES: ${{ inputs.names }}
          INPUT_UNIVERSE: ${{ inputs.universe }}
        run: |
          if [ -n "$INPUT_NAMES" ]; then
            [[ "$INPUT_NAMES" =~ ^[A-Za-z0-9.,_-]+$ ]] || { echo "Invalid symbol list" >&2; exit 2; }
            echo "WATCHLIST=$INPUT_NAMES" >> "$GITHUB_ENV"
            echo "SRC=custom" >> $GITHUB_ENV
          elif [ -n "$INPUT_UNIVERSE" ]; then
            [[ "$INPUT_UNIVERSE" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid universe name" >&2; exit 2; }
            echo "UNIVERSE=$INPUT_UNIVERSE" >> "$GITHUB_ENV"
            echo "WATCHLIST=" >> "$GITHUB_ENV"
            echo "SRC=$INPUT_UNIVERSE" >> "$GITHUB_ENV"
          else
            echo "WATCHLIST=$(grep -v '^#' src/watchlist.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV
            echo "UNIVERSE=" >> $GITHUB_ENV
            echo "SRC=watchlist" >> $GITHUB_ENV
          fi
          chmod +x bin/public-mcp
          mkdir -p reports

      - name: Pre-market screen
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ secrets.PUBLIC_ACCOUNT_ID }}
        run: |
          set -o pipefail
          : "${PUBLIC_ACCOUNT_ID:?Set repository secret PUBLIC_ACCOUNT_ID}"
          STAMP=$(date -u +%F-%H%M)
          echo "STAMP=$STAMP" >> $GITHUB_ENV
          ARGS=()
          if [ -n "$UNIVERSE" ]; then ARGS+=(--universe "$UNIVERSE"); else ARGS+=(--names "$WATCHLIST"); fi
          if [ -n "$INPUT_LIMIT" ]; then
            [[ "$INPUT_LIMIT" =~ ^[0-9]+$ ]] || { echo "Limit must be an integer" >&2; exit 2; }
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          python3 src/premarket_screen.py "${ARGS[@]}" \
            --json-out reports/premarket-screen-$STAMP.json | tee reports/premarket-screen-$STAMP.txt

      - name: Upload run outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-screen-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Render pre-market report
        if: always()
        run: |
          mkdir -p docs/reports
          STAMP=${STAMP:-$(date -u +%F-%H%M)}
          if [ "$SRC" = "custom" ]; then
            DETAIL="$(echo "$WATCHLIST" | tr ',' '\n' | grep -c . | tr -d ' ') names"
          elif [ -n "$UNIVERSE" ]; then
            DETAIL="$(PYTHONPATH=src python3 -c "import universes; print(str(len(universes.UNIVERSES['$UNIVERSE']))+' names')")"
          else
            DETAIL="$(grep -v '^#' src/watchlist.txt | grep -vc '^$' | tr -d ' ') names"
          fi
          python3 src/render_report.py --premarket reports/premarket-screen-$STAMP.json \
            --report-id premarket-$SRC-$STAMP --source "$SRC" --source-detail "$DETAIL"
          python3 src/render_hub.py
          ls docs/index.html

      - name: Publish dashboard to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- bin/public-mcp 2>/dev/null || true
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: update pre-market screen"
          git pull --rebase --strategy-option=theirs
          python3 src/render_hub.py
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: rebuild hub after rebase"
          git push
