name: Monthly PMCC screen

# Full pair-quality re-rank on the 3rd of each month, with JSON + report artifacts.
on:
  # Scheduled runs are owned by master.yml (which calls this workflow on the 3rd).
  # Manual runs use workflow_dispatch below.
  workflow_call:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated watchlist override (blank = use watchlist.txt)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PMCC quality screen
        env:
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          PUBLIC_MCP_CLI: ${{ github.workspace }}/bin/public-mcp
          PUBLIC_ACCOUNT_ID: ${{ vars.PUBLIC_ACCOUNT_ID }}
        run: |
          chmod +x bin/public-mcp
          mkdir -p reports
          STAMP=$(date +%F)
          if [ -n "${{ inputs.names }}" ]; then
            WATCHLIST="${{ inputs.names }}"
          else
            WATCHLIST=$(grep -v '^#' watchlist.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          fi
          python3 pmcc_quality.py --names "$WATCHLIST" --json-out reports/pmcc-quality-$STAMP.json | tee reports/pmcc-quality-$STAMP.txt

      - name: Upload run outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-screen-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Render PMCC report
        if: always()
        run: |
          mkdir -p docs/reports
          STAMP=$(date +%F)
          if [ -n "${{ inputs.names }}" ]; then
            SRC="custom"
            DETAIL="$(echo '${{ inputs.names }}' | tr ',' '\n' | grep -c . | tr -d ' ') names"
          else
            SRC="watchlist"
            DETAIL="$(grep -v '^#' watchlist.txt | grep -vc '^$' | tr -d ' ') names"
          fi
          python3 render_report.py --pmcc reports/pmcc-quality-$STAMP.json \
            --report-id pmcc-$SRC-$(date +%Y-%m) --source "$SRC" --source-detail "$DETAIL"
          python3 render_hub.py
          ls docs/index.html

      - name: Publish dashboard to GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/
          git diff --cached --quiet || git commit -m "dashboard: update monthly PMCC screen"
          git push
