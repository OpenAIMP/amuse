name: Master - all screens

# Central full run. Each child also keeps its own schedule and manual entry
# point; overlapping central/standalone runs are intentional.
on:
  schedule:
    # Pair UTC triggers so the active weekday run stays near 9:45am ET year-round.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    # First Sunday refresh: UTC schedule because index constituents change slowly.
    - cron: "0 6 1-7 * 0"
  workflow_dispatch:
    inputs:
      screen:
        description: "Run all screens or one workflow"
        type: choice
        required: true
        default: all
        options:
          - all
          - daily
          - premarket
          - intraday
          - leverage
          - monthly
          - universes
      names:
        description: "Comma-separated symbol override (blank = screen defaults)"
        type: string
        required: false
        default: ""
      universe:
        description: "Index universe override where supported (blank = screen default)"
        type: string
        required: false
        default: ""
      limit:
        description: "Optional cap for premarket/intraday screens"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.date.outputs.day }}
      first_sunday: ${{ steps.date.outputs.first_sunday }}
      market_run: ${{ steps.date.outputs.market_run }}
    steps:
      - id: date
        name: Resolve schedule date in Eastern time
        shell: bash
        run: |
          day=$(TZ=America/New_York date +%d)
          weekday=$(TZ=America/New_York date +%u)
          first_sunday=false
          if [ "$weekday" = "7" ] && [ "$day" -le 7 ]; then first_sunday=true; fi
          local_hm=$(TZ=America/New_York date +%-H%M)
          market_run=false
          if [ "$local_hm" -ge 0935 ] && [ "$local_hm" -le 1030 ]; then market_run=true; fi
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "first_sunday=$first_sunday" >> "$GITHUB_OUTPUT"
          echo "market_run=$market_run" >> "$GITHUB_OUTPUT"

  premarket:
    needs: setup
    if: ${{ (github.event_name == 'schedule' && needs.setup.outputs.market_run == 'true' && (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5')) || inputs.screen == 'all' || inputs.screen == 'premarket' }}
    uses: ./.github/workflows/premarket-screen.yml
    with:
      names: ${{ inputs.names }}
      universe: ${{ inputs.universe }}
      limit: ${{ inputs.limit }}
    secrets: inherit

  daily:
    needs: [setup, premarket]
    if: ${{ always() && ((github.event_name == 'schedule' && needs.setup.outputs.market_run == 'true' && (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5')) || inputs.screen == 'all' || inputs.screen == 'daily') }}
    uses: ./.github/workflows/daily-watch.yml
    with:
      names: ${{ inputs.names }}
      universe: ${{ inputs.universe }}
    secrets: inherit

  intraday:
    needs: [setup, daily]
    if: ${{ always() && ((github.event_name == 'schedule' && needs.setup.outputs.market_run == 'true' && (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5')) || inputs.screen == 'all' || inputs.screen == 'intraday') }}
    uses: ./.github/workflows/intraday-screen.yml
    with:
      names: ${{ inputs.names }}
      universe: ${{ inputs.universe }}
      limit: ${{ inputs.limit }}
    secrets: inherit

  leverage:
    needs: [setup, intraday]
    if: ${{ always() && ((github.event_name == 'schedule' && needs.setup.outputs.market_run == 'true' && (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5')) || inputs.screen == 'all' || inputs.screen == 'leverage') }}
    uses: ./.github/workflows/leverage-screen.yml
    with:
      names: ${{ inputs.names }}
    secrets: inherit

  monthly:
    needs: [setup, leverage]
    if: ${{ always() && ((github.event_name == 'schedule' && needs.setup.outputs.market_run == 'true' && (github.event.schedule == '45 13 * * 1-5' || github.event.schedule == '45 14 * * 1-5') && needs.setup.outputs.day == '03') || (github.event_name == 'workflow_dispatch' && (inputs.screen == 'all' || inputs.screen == 'monthly'))) }}
    uses: ./.github/workflows/monthly-screen.yml
    with:
      names: ${{ inputs.names }}
    secrets: inherit

  universes:
    needs: [setup, monthly]
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '0 6 1-7 * 0' && needs.setup.outputs.first_sunday == 'true') || (github.event_name == 'workflow_dispatch' && (inputs.screen == 'all' || inputs.screen == 'universes'))) }}
    uses: ./.github/workflows/build-universes.yml
    secrets: inherit
